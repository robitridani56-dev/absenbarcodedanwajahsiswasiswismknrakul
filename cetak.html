      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var line = '';
      for (y = 0; y < size; y += 1) {

        for (x = 0; x < size; x += 1) {

        var b = bin.read();

        return b;

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;

      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);

  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(0,217,192,0.10), transparent 45%),
      var(--bg);
    color:var(--text); font-family:'Inter', sans-serif; min-height:100vh;
  }

  /* ============ TOOLBAR (layar saja) ============ */
  .toolbar{
    position:sticky; top:0; z-index:20;
    background:rgba(8,13,26,0.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:20px 36px; display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  }
  .toolbar-brand{ display:flex; align-items:center; gap:12px; margin-right:auto; }
  .toolbar-brand img{
    width:38px; height:38px; object-fit:contain; flex-shrink:0;
    background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(232,236,244,0.75));
    border-radius:50%; padding:5px; box-shadow:0 0 16px rgba(0,217,192,0.3);
  }
  .toolbar h1{
    font-family:'Space Grotesk', sans-serif; font-size:19px; font-weight:600;
  }
  .toolbar h1 span{ display:block; font-family:'JetBrains Mono', monospace; font-size:11px;
    color:var(--teal); letter-spacing:.12em; text-transform:uppercase; margin-bottom:3px; }

  .tb-input, .tb-select{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:10px 14px; border-radius:10px; font-size:14px; font-family:'Inter';
  }
  .tb-input{ width:220px; }
  .tb-btn{
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:14px;
    padding:10px 20px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text); cursor:pointer; transition:.2s;
  }
  .tb-btn:hover{ border-color:var(--teal); color:var(--teal); }
  .tb-btn.primary{
    background:linear-gradient(135deg, var(--teal), #0A9E8C); color:#04140F; border:none;
  }
  .tb-btn.primary:hover{ filter:brightness(1.08); color:#04140F; }
  .tb-meta{ font-size:13px; color:var(--muted); font-family:'JetBrains Mono', monospace; }

  /* ============ GRID KARTU ============ */
  .wrap{ padding:32px 36px 60px; }
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:20px; max-width:1400px; margin:0 auto;
  }
  .loading, .empty{ color:var(--muted); text-align:center; padding:60px 0; font-size:15px; }

  .kartu{
    background-color:#FFFFFF;
    background-repeat:no-repeat, no-repeat;
    background-position:center, center 60%;
    background-size:cover, 32%;
    /* background-image di-set lewat JS (dua layer: overlay putih transparan + foto logo, urutan sesuai). Ukuran logo pakai lebar saja (tinggi otomatis) supaya seluruh logo utuh, tidak terpotong/di-crop. */
    color:#0B1120; border-radius:16px; overflow:hidden;
    display:flex; flex-direction:column; position:relative;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .kartu-head{
    background:linear-gradient(135deg, #0B1120, #142033);
    color:#fff; padding:12px 16px; display:flex; align-items:center; gap:10px;
  }
  .kartu-head .badge{
    width:26px; height:26px; border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95), rgba(232,236,244,0.85));
    display:flex; align-items:center; justify-content:center; flex-shrink:0; padding:3px;
  }
  .kartu-head .badge img{ width:100%; height:100%; object-fit:contain; }
  .kartu-head .sekolah{ font-family:'Space Grotesk', sans-serif; font-size:12.5px; font-weight:600; line-height:1.2; }
  .kartu-head .sekolah small{ display:block; font-family:'JetBrains Mono', monospace; font-size:9px;
    color:var(--teal); letter-spacing:.1em; text-transform:uppercase; }

  .kartu-select{ position:absolute; top:10px; right:10px; width:18px; height:18px; z-index:2; }

  .kartu-body{ display:flex; gap:14px; padding:16px; align-items:center; }
  .kartu-foto-wrap{
    width:64px; height:64px; border-radius:12px; flex-shrink:0; position:relative;
    background:#EEF1F7; border:1px solid #E2E6EF; overflow:hidden;
  }
  .kartu-foto{
    width:100%; height:100%; object-fit:cover; display:block; position:relative; z-index:1;
    object-position:center 18%; transform:scale(1.18); transform-origin:center top;
  }
  .kartu-foto-fallback{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:20px; color:#8A97B3;
    background:#EEF1F7;
  }
  .kartu-info{ min-width:0; }
  .kartu-info .nama{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:15px; line-height:1.2;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .kartu-info .kelas{ font-size:12px; color:#5A6B8C; margin-top:2px; }

  @media print{
    body{ background:#fff; }
    .toolbar{ display:none; }
    .wrap{ padding:0; }
    .grid{ gap:8px; max-width:none; }
    .kartu{ box-shadow:none; border:1px solid #D8DCE6; break-inside:avoid; }
    .kartu-select{ display:none; }
  }
</style>

  if (!nama) return '?';
  const kata = nama.toString().trim().split(/\s+/);
  return ((kata[0][0] || '') + (kata[1] ? kata[1][0] : '')).toUpperCase();
}

async function muatData(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '<div class="loading">Memuat data siswa dari spreadsheet…</div>';
  try{
    const res = await fetch(API_URL + "?action=getAllStudents");
    const data = await res.json();
    if (!data.success || !data.siswa.length){
      grid.innerHTML = '<div class="empty">Belum ada data siswa di sheet "Siswa".</div>';
      return;
    }
    semuaSiswa = data.siswa;
    isiFilterKelas();
    render(semuaSiswa);
  }catch(err){
    grid.innerHTML = '<div class="empty">Gagal memuat data. Pastikan API_URL di file ini sudah benar.</div>';
  }
}

function isiFilterKelas(){
  const select = document.getElementById('kelasFilter');
  const kelasSet = [...new Set(semuaSiswa.map(s => s.kelas).filter(Boolean))].sort();
  select.innerHTML = '<option value="">Semua Kelas</option>' +
    kelasSet.map(k => `<option value="${k}">${k}</option>`).join('');
}

function render(list){
  const grid = document.getElementById('grid');

  if (!list.length){
    grid.innerHTML = '<div class="empty">Tidak ada siswa yang cocok dengan pencarian.</div>';
    updateHitung();
    return;
  }
  grid.innerHTML = list.map((s, i) => {
    const kodeAman = (s.barcode || '').toString().trim();
    const kodeEscaped = kodeAman.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    return `
    <div class="kartu" style="background-image:linear-gradient(rgba(255,255,255,0.85),rgba(255,255,255,0.85)),url('${LOGO_BG_URI}')">
      <input type="checkbox" class="kartu-select" data-idx="${i}" checked>
      <div class="kartu-head">
        <div class="badge"><img src="${LOGO_URI}" alt="Logo SMKN Rakit Kulim"></div>
        <div class="sekolah"><small>Kartu Absensi</small>SMKN Rakit Kulim</div>
      </div>
      <div class="kartu-body">
        <div class="kartu-foto-wrap">
          <img class="kartu-foto" src="${s.foto || ''}" alt=""
               onerror="this.closest('.kartu-foto-wrap').classList.add('gagal'); this.remove();">
          <div class="kartu-foto-fallback">${inisial(s.nama)}</div>
        </div>
        <div class="kartu-info">
          <div class="nama">${s.nama || '-'}</div>
          <div class="kelas">${s.kelas || '-'}</div>
          <div class="nis">NIS: ${s.nis || '-'}</div>
        </div>
      </div>
      <div class="kartu-barcode">
        <div class="bc" data-code="${kodeEscaped}"></div>
        <div class="kode">${kodeAman || '(kode barcode kosong)'}</div>
      </div>
    </div>
  `;
  }).join('');

  renderSemuaQR();
}

function renderSemuaQR(){
  document.querySelectorAll('div.bc').forEach(el => {
    const kode = el.dataset.code;
    if (!kode){
      el.outerHTML = '<div style="font-size:11px;color:#C0453D;padding:8px 0;">Kode barcode kosong — isi kolom ID_Barcode di sheet Siswa</div>';
      return;
    }
    try{
      const qr = qrcode(0, 'M'); // 0 = deteksi ukuran QR otomatis sesuai panjang kode
      qr.addData(kode);
      qr.make();
      el.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    }catch(errQr){
      el.outerHTML = '<div style="font-size:11px;color:#C0453D;padding:8px 0;">Gagal membuat QR untuk kode: ' + kode + '</div>';
    }
  });

  document.querySelectorAll('.kartu-select').forEach(cb => cb.addEventListener('change', updateHitung));
  updateHitung();
}

function terapkanFilter(){
  const q = document.getElementById('cariInput').value.trim().toLowerCase();
  const kelas = document.getElementById('kelasFilter').value;
  const hasil = semuaSiswa.filter(s => {
    const cocokKelas = !kelas || s.kelas === kelas;
    const cocokCari = !q || (s.nama || '').toLowerCase().includes(q) || (s.nis || '').toString().includes(q);
    return cocokKelas && cocokCari;
  });
  render(hasil);
}

function updateHitung(){
  const total = document.querySelectorAll('.kartu-select').length;
  const dipilih = document.querySelectorAll('.kartu-select:checked').length;
  document.getElementById('hitungInfo').textContent = `${dipilih} dari ${total} siswa dipilih`;
}

document.getElementById('cariInput').addEventListener('input', terapkanFilter);
document.getElementById('kelasFilter').addEventListener('change', terapkanFilter);
document.getElementById('muatUlangBtn').addEventListener('click', muatData);

document.getElementById('pilihSemuaBtn').addEventListener('click', () => {
  const boxes = document.querySelectorAll('.kartu-select');
  const semuaTercentang = [...boxes].every(b => b.checked);
  boxes.forEach(b => b.checked = !semuaTercentang);
  updateHitung();
});

document.getElementById('cetakBtn').addEventListener('click', () => {
  // Sembunyikan kartu yang tidak dicentang sebelum print
  document.querySelectorAll('.kartu-select').forEach(cb => {
    cb.closest('.kartu').style.display = cb.checked ? '' : 'none';
  });
  window.print();
  setTimeout(() => {
    document.querySelectorAll('.kartu').forEach(k => k.style.display = '');
  }, 500);
});

muatData();
</script>
</body>
</html>
